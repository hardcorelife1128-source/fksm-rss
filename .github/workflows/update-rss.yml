name: Update environment news RSS
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate_feed.py
      - generate_hkbs.py
      - .github/workflows/update-rss.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: environment-rss
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect FKSM articles
        id: fksm
        continue-on-error: true
        run: python generate_feed.py
      - name: Collect HKBS articles
        id: hkbs
        continue-on-error: true
        run: python generate_hkbs.py
      - name: Preserve the last successful feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update RSS feed"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish RSS
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failures
        if: steps.fksm.outcome == 'failure' || steps.hkbs.outcome == 'failure'
        run: |
          echo "A source failed. Its last successful feed was retained; inspect collection logs."
          exit 1
