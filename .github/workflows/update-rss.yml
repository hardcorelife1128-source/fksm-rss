name: Update environment news RSS
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate_feed.py
      - generate_hkbs.py
      - .github/workflows/update-rss.yml
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: environment-rss
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Collect FKSM articles
        id: fksm
        continue-on-error: true
        run: python generate_feed.py
      - name: Collect HKBS articles
        id: hkbs
        continue-on-error: true
        run: python generate_hkbs.py
      - name: Preserve the last successful feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update RSS feed"
            git push
          fi
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: docs
      - name: Wait until uploaded artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            visible_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' 2>/dev/null || true)"
            if [ -n "$EXPECTED_ARTIFACT_ID" ] && [ "$visible_id" = "$EXPECTED_ARTIFACT_ID" ]; then
              echo "Uploaded Pages artifact is ready."
              exit 0
            fi
            echo "Waiting for Pages artifact metadata (attempt $attempt/6)."
            sleep 10
          done
          echo "::error::Uploaded Pages artifact did not become visible in time."
          exit 1
      - name: Publish RSS
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Wait before retrying a failed deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry RSS deployment once
        id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Report collection failures
        if: steps.fksm.outcome == 'failure' || steps.hkbs.outcome == 'failure'
        run: |
          echo "A source failed. Its last successful feed was retained; inspect collection logs."
          exit 1
